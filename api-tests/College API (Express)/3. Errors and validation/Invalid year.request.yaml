$kind: http-request
description: "Well-formed JSON but breaks a rule: 422."
url: "{{baseUrl}}/students"
method: POST
headers:
  Authorization: 'Bearer {{token}}'
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Asha",
      "department": "CSE",
      "year": 9
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 422", function () { pm.response.to.have.status(422); });
    language: text/javascript
order: 2000
