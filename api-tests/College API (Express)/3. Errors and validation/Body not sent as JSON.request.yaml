$kind: http-request
description: express.json() ignores non-JSON bodies, so req.body is undefined.
url: "{{baseUrl}}/students"
method: POST
headers:
  Content-Type: text/plain
body:
  type: text
  content: name=Asha
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 3000
