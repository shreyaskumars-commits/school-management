$kind: http-request
name: Other origin (not approved)
description: 'Still 200 here, because Postman is not a browser. The header still says http://localhost:5173, which does not match this Origin, so a browser page from that origin would be blocked.'
url: '{{baseUrl}}/students'
method: GET
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Origin
    value: 'http://evil.example'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Access-Control-Allow-Origin is not http://evil.example", function () { pm.expect(pm.response.headers.get("Access-Control-Allow-Origin")).to.not.eql("http://evil.example"); });
order: 2000
