$kind: http-request
name: Missing required fields
description: 'department is missing: 400 Bad Request.'
url: '{{baseUrl}}/students'
method: POST
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Asha"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status is 400", function () { pm.response.to.have.status(400); });'
order: 1000
