$kind: http-request
name: Student not found
description: 'Valid numeric id but no such student: 404.'
url: '{{baseUrl}}/students/999999'
method: GET
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status is 404", function () { pm.response.to.have.status(404); });'
order: 6000
