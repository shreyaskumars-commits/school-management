$kind: http-request
name: Body not sent as JSON
description: 'express.json() ignores non-JSON bodies, so req.body is undefined.'
url: '{{baseUrl}}/students'
method: POST
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: text/plain
body:
  type: text
  content: name=Asha
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status is 400", function () { pm.response.to.have.status(400); });'
order: 3000
