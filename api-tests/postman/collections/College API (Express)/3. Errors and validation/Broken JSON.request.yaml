$kind: http-request
name: Broken JSON
description: 'express.json() rejects it; the error-handling middleware returns 400.'
url: '{{baseUrl}}/students'
method: POST
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{ "name": "Asha", '
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status is 400", function () { pm.response.to.have.status(400); });'
order: 4000
