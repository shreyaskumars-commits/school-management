$kind: http-request
name: Delete student
description: 'Expected: 204 No Content (empty body).'
url: '{{baseUrl}}/students/{{newStudentId}}'
method: DELETE
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status is 204", function () { pm.response.to.have.status(204); });'
order: 7000
