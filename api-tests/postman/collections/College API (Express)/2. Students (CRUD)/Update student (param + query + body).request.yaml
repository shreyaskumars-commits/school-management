$kind: http-request
name: 'Update student (param + query + body)'
description: 'All three request sources in one call: req.params.id, req.query.notify, req.body.'
url: '{{baseUrl}}/students/{{newStudentId}}?notify=true'
method: PATCH
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
queryParams:
  - key: notify
    value: 'true'
body:
  type: json
  content: |-
    {
      "department": "AI"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status is 200", function () { pm.response.to.have.status(200); });'
order: 6000
