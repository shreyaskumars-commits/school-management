$kind: http-request
name: Get one student (path param)
description: 'req.params.id = the id of the first listed student (saved as studentId by List students).'
url: '{{baseUrl}}/students/{{studentId}}'
method: GET
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status is 200", function () { pm.response.to.have.status(200); });'
order: 4000
